<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Training — S2</title><style>
:root{--bg:#090b0f;--card:#141820;--card2:#1a1f29;--text:#f5f7fb;--muted:#929baa;--line:#29303c;--accent:#7c5cff;--good:#43d17c}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif}body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom))}button,input{font:inherit}button{cursor:pointer}header{padding:24px 18px 12px;display:flex;justify-content:space-between;align-items:flex-start}header small{color:var(--muted);font-size:11px;letter-spacing:.12em;font-weight:700}h1{font-size:34px;margin:4px 0 0}h2{font-size:24px;margin:8px 0}.ghost,.back{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 12px}.ghost{font-size:12px}main{padding:0 16px;max-width:720px;margin:auto}.view{display:none}.view.active{display:block}.weekcard{background:linear-gradient(145deg,#181d27,#10141b);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:16px}.pill{font-size:11px;font-weight:800;letter-spacing:.08em;color:#bdb2ff}.weekcard p,.muted{color:var(--muted);margin:6px 0}.ring{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) 0%,#272d38 0);font-weight:800;border:7px solid #222834}.sessions{display:grid;gap:10px;margin:14px 0}.session{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:18px;padding:16px;display:flex;justify-content:space-between;align-items:center}.session strong{display:block;font-size:17px}.session span{display:block;color:var(--muted);font-size:13px;margin-top:4px}.session.done{border-color:#315f45}.check{font-size:22px;color:var(--good)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 10px}.stats b{font-size:21px;display:block}.stats span{font-size:11px;color:var(--muted)}#workoutHead{padding:14px 2px}.exercise{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:10px 0;padding:14px}.exercise h3{margin:0 0 5px;font-size:18px}.meta{color:var(--muted);font-size:12px;margin-bottom:10px}.setrow{display:grid;grid-template-columns:34px 1fr 1fr .8fr 42px;gap:6px;align-items:center;margin:7px 0}.setnum{font-size:12px;color:var(--muted)}input{width:100%;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:11px 7px;text-align:center;font-size:15px}input::placeholder{color:#646d7a}.tick{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:#8d96a5}.tick.on{background:var(--good);color:#07130b;border-color:var(--good);font-weight:900}.labels{display:grid;grid-template-columns:34px 1fr 1fr .8fr 42px;gap:6px;color:var(--muted);font-size:10px;text-align:center;margin-top:4px}.finish{width:100%;margin:14px 0 8px;border:0;background:var(--accent);color:white;border-radius:15px;padding:15px;font-weight:800}.historyCard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.historyCard b{display:block}.historyCard span{color:var(--muted);font-size:13px}nav{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(9,11,15,.92);backdrop-filter:blur(18px);display:flex;gap:8px;border-top:1px solid var(--line);z-index:5}.nav{flex:1;border:0;border-radius:13px;padding:12px;background:transparent;color:var(--muted);font-weight:700}.nav.active{background:var(--card2);color:var(--text)}
</style></head><body><header><div><small>PROGRAMME FORCE & MASSE</small><h1>Training</h1></div><button id="resetBtn" class="ghost">Réinitialiser</button></header><main><section id="home" class="view active"><div class="weekcard"><div><span class="pill">SEMAINE 2</span><h2>Ta semaine d'entraînement</h2><p id="progressText"></p></div><div class="ring" id="ring">0%</div></div><div id="sessions" class="sessions"></div><div class="stats"><div><b id="setsDone">0</b><span>séries validées</span></div><div><b id="totalReps">0</b><span>reps saisies</span></div><div><b id="avgRir">—</b><span>RIR moyen</span></div></div></section><section id="workout" class="view"><button id="backBtn" class="back">‹ Semaine 2</button><div id="workoutHead"></div><div id="exerciseList"></div><button id="finishBtn" class="finish">Terminer la séance ✓</button></section><section id="history" class="view"><h2>Historique</h2><p class="muted">Tes performances de S2 sont sauvegardées sur cet appareil.</p><div id="historyContent"></div></section></main><nav><button data-view="home" class="nav active">Semaine</button><button data-view="history" class="nav">Historique</button></nav><script>
const sessions=[
{day:'Lundi',name:'Upper Force',ex:[['Développé couché',5,'117,5 puis 105','1×5 + 4×6','3–4 min'],['Rowing convergent',4,'80 / bras','8','2 min'],['Développé incliné haltères',3,'42 / main','8–10','2 min'],['Tirage vertical',3,'90','8–10','2 min'],['Élévations latérales',3,'12','12–15','60–90 s'],['Curl EZ',3,'30','8–10','90 s'],['Extension triceps poulie',3,'27,5','10–12','60–90 s']]},
{day:'Mardi',name:'Legs A + Abdos + Cardio',ex:[['Presse 45°',4,'160','6–8','2–3 min'],['Presse unilatérale',3,'60 / jambe','8–10','2 min'],['Fentes marchées',3,'16 / main','10 pas/jambe','90 s'],['Leg extension',3,'40','12–15','90 s'],['Leg curl bilatéral',4,'30–35','10–12','90 s'],['Mollets',4,'À trouver','10–15','60–90 s'],['Crunch poulie lesté',4,'35','10–15','60 s'],['Relevés de jambes',3,'PDC','10–15','60 s']]},
{day:'Mercredi',name:'Push Hypertrophie',ex:[['Développé couché volume',3,'100','9 / 9 / 9','2–3 min'],['Presse pecs',3,'70 / bras','10–12','90–120 s'],['Écartés machine',3,'54','12–15','60–90 s'],['Développé épaules machine',3,'60 / bras','8–12','2 min'],['Élévations latérales',3,'12','12–20','60 s'],['Extension triceps au-dessus tête',3,'14','10–15','60–90 s'],['Extension triceps poulie',3,'30','12–15','60–90 s']]},
{day:'Jeudi',name:'Pull Hypertrophie + Abdos',ex:[['Tractions PDC',3,'PDC','10–15','2 min'],['Tirage vertical',3,'85','10–12','2 min'],['Rowing convergent',3,'80','10–12','2 min'],['Rowing assis poulie',3,'79','10–12','90–120 s'],['Pullover / bras tendus poulie',3,'25','12–15','60–90 s'],['Oiseau / reverse fly',3,'14','12–20','60 s'],['Curl marteau haltères',3,'22 / main','8–12','90 s'],['Curl pupitre haltère',3,'14','10–12','90 s'],['Crunch machine/poulie',3,'30','12–15','60 s']]},
{day:'Vendredi',name:'Legs B + Bras + Cardio',ex:[['Presse 45°',3,'120','10–12','2 min'],['Presse unilatérale',3,'60','10–12','90–120 s'],['Leg curl',4,'35','10–15','90 s'],['Leg extension',3,'60','12–15','90 s'],['Abducteurs machine',3,'50','12–20','60–90 s'],['Curl marteau corde',3,'À trouver','10–15','60–90 s'],['Curl machine/pupitre',3,'À trouver','10–15','60–90 s'],['Extension triceps haltère',3,'15 / bras','10–15','60–90 s'],['Extension triceps poulie',3,'À trouver','12–15','60–90 s']]}
];
let state=JSON.parse(localStorage.getItem('trainingS2v2')||'{"done":{},"sets":{}}'),current=0;const $=id=>document.getElementById(id);function save(){localStorage.setItem('trainingS2v2',JSON.stringify(state));renderHome()}function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===id));if(id==='history')renderHistory()}function renderHome(){let done=Object.values(state.done).filter(Boolean).length,p=Math.round(done/5*100);$('progressText').textContent=`${done} séance${done>1?'s':''} terminée${done>1?'s':''} sur 5`;$('ring').textContent=p+'%';$('ring').style.background=`conic-gradient(var(--accent) ${p}%,#272d38 ${p}%)`;$('sessions').innerHTML=sessions.map((s,i)=>`<button class="session ${state.done[i]?'done':''}" onclick="openWorkout(${i})"><div><strong>${s.day} — ${s.name}</strong><span>${s.ex.length} exercices</span></div><div class="check">${state.done[i]?'✓':'›'}</div></button>`).join('');let vals=Object.values(state.sets),valid=vals.filter(x=>x.ok),reps=vals.reduce((a,x)=>a+(+x.reps||0),0),rirs=vals.map(x=>+x.rir).filter(Number.isFinite);$('setsDone').textContent=valid.length;$('totalReps').textContent=reps;$('avgRir').textContent=rirs.length?(rirs.reduce((a,b)=>a+b,0)/rirs.length).toFixed(1):'—'}
window.openWorkout=i=>{current=i;let s=sessions[i];$('workoutHead').innerHTML=`<span class="pill">${s.day.toUpperCase()}</span><h2>${s.name}</h2>`;$('exerciseList').innerHTML=s.ex.map((e,ei)=>`<div class="exercise"><h3>${e[0]}</h3><div class="meta">Objectif : ${e[2]} kg • ${e[3]} reps • Repos ${e[4]}</div><div class="labels"><span></span><span>KG</span><span>REPS</span><span>RIR</span><span></span></div>${Array.from({length:e[1]},(_,si)=>{let k=`${i}-${ei}-${si}`,d=state.sets[k]||{};return `<div class="setrow"><span class="setnum">S${si+1}</span><input inputmode="decimal" placeholder="kg" value="${d.kg||''}" oninput="upd('${k}','kg',this.value)"><input inputmode="numeric" placeholder="reps" value="${d.reps||''}" oninput="upd('${k}','reps',this.value)"><input inputmode="decimal" placeholder="RIR" value="${d.rir||''}" oninput="upd('${k}','rir',this.value)"><button class="tick ${d.ok?'on':''}" onclick="toggleSet('${k}',this)">${d.ok?'✓':'○'}</button></div>`}).join('')}</div>`).join('');show('workout')};window.upd=(k,f,v)=>{state.sets[k]=state.sets[k]||{};state.sets[k][f]=v;save()};window.toggleSet=(k,b)=>{state.sets[k]=state.sets[k]||{};state.sets[k].ok=!state.sets[k].ok;b.classList.toggle('on',state.sets[k].ok);b.textContent=state.sets[k].ok?'✓':'○';save()};$('finishBtn').onclick=()=>{state.done[current]=true;save();show('home')};$('backBtn').onclick=()=>show('home');document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>show(b.dataset.view));$('resetBtn').onclick=()=>{if(confirm('Effacer toutes les saisies de S2 ?')){state={done:{},sets:{}};save();show('home')}};function renderHistory(){$('historyContent').innerHTML=sessions.map((s,i)=>{let n=Object.entries(state.sets).filter(([k,v])=>k.startsWith(i+'-')&&v.ok).length;return `<div class="historyCard"><b>${s.day} — ${s.name} ${state.done[i]?'✓':''}</b><span>${n} séries validées</span></div>`}).join('')}renderHome();
</script></body></html>
