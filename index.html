<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0f"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Training</title><meta name="training-version" content="5">
<style>
:root{--bg:#090b0f;--card:#151820;--card2:#1b1f29;--line:#303644;--txt:#f5f6fa;--muted:#969dac;--accent:#b9a5ff;--green:#61d98b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:calc(22px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom));}
.wrap{max-width:680px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{letter-spacing:.15em;color:var(--muted);font-weight:800;font-size:12px}.title{font-size:42px;margin:7px 0 24px}.btn{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:12px 15px;border-radius:15px;font-size:16px}.hero,.session,.exercise{background:var(--card);border:1px solid var(--line);border-radius:24px}.hero{padding:22px;margin-bottom:16px}.accent{color:var(--accent);font-weight:800}.heroRow{display:flex;justify-content:space-between;align-items:center}.pct{font-size:25px;font-weight:800}.session{padding:20px;margin:12px 0;cursor:pointer}.session h3{margin:0 0 5px;font-size:20px}.muted{color:var(--muted)}.back{margin-bottom:22px}.day{color:var(--accent);font-weight:800;letter-spacing:.1em}.workTitle{font-size:32px;margin:10px 0 22px}.exercise{padding:16px;margin:13px 0}.exercise h3{font-size:22px;margin:0 0 6px}.target{color:var(--muted);font-size:14px;line-height:1.35;margin-bottom:14px}.setrow{display:grid;grid-template-columns:34px 1fr 1fr 74px 48px;gap:7px;align-items:center;margin:8px 0}.setrow input{width:100%;min-width:0;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:13px;padding:12px 8px;font-size:16px;text-align:center}.setrow input.done{opacity:.55}.check{height:44px;border-radius:13px;border:1px solid var(--line);background:var(--card2);color:var(--green);font-size:22px}.check.on{background:#163321}.finish{width:100%;margin:20px 0;background:var(--green);color:#07120b;border:0;border-radius:17px;padding:16px;font-weight:900;font-size:18px}.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));background:#252a35;border:1px solid #454d5e;border-radius:18px;padding:10px 16px;display:none;z-index:5;font-weight:700}.timer.show{display:block}.nav{position:fixed;bottom:0;left:0;right:0;background:#0b0d12;border-top:1px solid var(--line);display:flex;justify-content:center;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));}.nav button{max-width:330px;flex:1;border:0;border-radius:16px;background:transparent;color:var(--muted);padding:13px;font-size:17px;font-weight:700}.nav button.active{background:var(--card2);color:var(--txt)}.historyItem{padding:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;margin:10px 0}.small{font-size:13px}.danger{color:#ff9696}.hidden{display:none}
.updatebar{display:none;position:sticky;top:8px;z-index:20;background:#252a35;border:1px solid #596174;border-radius:16px;padding:12px 14px;margin-bottom:14px;align-items:center;justify-content:space-between;gap:10px}
.updatebar.show{display:flex}.updatebar button{border:0;background:var(--green);color:#07120b;font-weight:800;border-radius:12px;padding:9px 12px}
</style></head><body><div class="wrap"><div id="updatebar" class="updatebar"><span>Nouvelle version disponible</span><button onclick="applyUpdate()">Mettre à jour</button></div><div id="app"></div></div><div class="timer" id="timer"></div><div class="nav"><button id="weekBtn" class="active">Semaine</button><button id="histBtn">Historique</button></div>
<script>
let sessions=[{"day": "Lundi", "name": "Upper Force", "ex": [{"name": "Développé couché", "sets": [["117.5", "5"], ["105", "6"], ["105", "6"], ["105", "6"], ["105", "6"]], "rest": "3–4 min", "note": "Top set RIR 1–2 • Back-off ≈ RIR 2"}, {"name": "Rowing convergent", "sets": [["80", "8–9"], ["80", "8–9"], ["80", "8–9"], ["80", "8–9"]], "rest": "2 min", "note": "Charge par bras"}, {"name": "Développé incliné haltères", "sets": [["42", "8–10"], ["42", "8–10"], ["42", "8–10"]], "rest": "2 min", "note": "Charge par bras"}, {"name": "Tirage vertical", "sets": [["90", "9–10"], ["90", "9–10"], ["90", "9–10"]], "rest": "2 min", "note": ""}, {"name": "Élévations latérales", "sets": [["12", "13–15"], ["12", "13–15"], ["12", "13–15"]], "rest": "60–90 s", "note": ""}, {"name": "Curl EZ", "sets": [["30", "10–12"], ["30", "10–12"], ["30", "10–12"]], "rest": "90 s", "note": ""}, {"name": "Triceps poulie", "sets": [["27.5", "12–13"], ["27.5", "12–13"], ["27.5", "12–13"]], "rest": "60–90 s", "note": ""}]}, {"day": "Mardi", "name": "Legs A + Abdos + Cardio", "ex": [{"name": "Presse à 45°", "sets": [["160", "7"], ["160", "7"], ["160", "7"], ["160", "7"]], "rest": "2–3 min", "note": ""}, {"name": "Presse unilatérale", "sets": [["60", "10–11"], ["60", "10–11"], ["60", "10–11"]], "rest": "2 min", "note": "Charge par jambe"}, {"name": "Fentes marchées", "sets": [["16", "10 pas/jambe"], ["16", "10 pas/jambe"], ["16", "10 pas/jambe"]], "rest": "90 s", "note": "Charge par main"}, {"name": "Leg extension", "sets": [["40", "15"], ["40", "15"], ["40", "15"]], "rest": "90 s", "note": ""}, {"name": "Leg curl bilatéral", "sets": [["30–35", "12–15"], ["30–35", "12–15"], ["30–35", "12–15"]], "rest": "90 s", "note": "Remplace l’unilatéral • zéro douleur"}, {"name": "Mollets", "sets": [["", "10–15"], ["", "10–15"], ["", "10–15"], ["", "10–15"]], "rest": "60–90 s", "note": "Trouver la charge"}, {"name": "Crunch poulie", "sets": [["35", "15"], ["35", "15"], ["35", "15"], ["35", "15"]], "rest": "60–90 s", "note": ""}, {"name": "Relevés de jambes", "sets": [["PDC", "15"], ["PDC", "15"], ["PDC", "15"]], "rest": "60 s", "note": ""}, {"name": "Cardio", "sets": [["", "15–20 min"]], "rest": "", "note": "Intensité modérée"}]}, {"day": "Mercredi", "name": "Push Hypertrophie", "ex": [{"name": "Développé couché volume", "sets": [["100", "9"], ["100", "9"], ["100", "9"]], "rest": "2–3 min", "note": "Objectif 9/9/9 • sans échec"}, {"name": "Chest press", "sets": [["70", "9–10"], ["70", "9–10"], ["70", "9–10"]], "rest": "2 min", "note": "Charge par bras"}, {"name": "Écarté machine", "sets": [["54", "15"], ["54", "15"], ["54", "15"]], "rest": "90 s", "note": ""}, {"name": "Shoulder press machine", "sets": [["60", "12"], ["60", "12"], ["60", "12"]], "rest": "2 min", "note": "Charge par bras"}, {"name": "Élévations latérales", "sets": [["12", "13–15"], ["12", "13–15"], ["12", "13–15"]], "rest": "60–90 s", "note": ""}, {"name": "Extension triceps au-dessus de la tête", "sets": [["14", "15"], ["14", "15"], ["14", "15"]], "rest": "60–90 s", "note": ""}, {"name": "Triceps poulie", "sets": [["30", "15"], ["30", "15"], ["30", "15"]], "rest": "60–90 s", "note": ""}]}, {"day": "Jeudi", "name": "Pull Hypertrophie + Abdos", "ex": [{"name": "Tractions", "sets": [["PDC", "12"], ["PDC", "12"], ["PDC", "12"]], "rest": "2 min", "note": ""}, {"name": "Tirage vertical", "sets": [["85", "11"], ["85", "11"], ["85", "11"]], "rest": "2 min", "note": ""}, {"name": "Rowing convergent", "sets": [["80", "11"], ["80", "11"], ["80", "11"]], "rest": "2 min", "note": "Charge par bras"}, {"name": "Rowing assis", "sets": [["79", "12"], ["79", "12"], ["79", "12"]], "rest": "2 min", "note": ""}, {"name": "Pullover", "sets": [["25", "15"], ["25", "15"], ["25", "15"]], "rest": "90 s", "note": ""}, {"name": "Reverse fly", "sets": [["14", "15–16"], ["14", "15–16"], ["14", "15–16"]], "rest": "60–90 s", "note": ""}, {"name": "Curl marteau haltères", "sets": [["22", "11"], ["22", "11"], ["22", "11"]], "rest": "90 s", "note": "Charge par main"}, {"name": "Curl pupitre haltère", "sets": [["14", "10–12"], ["14", "10–12"], ["14", "10–12"]], "rest": "90 s", "note": "Charge par bras"}, {"name": "Crunch", "sets": [["30", "15"], ["30", "15"], ["30", "15"]], "rest": "60–90 s", "note": ""}, {"name": "Gainage lesté", "sets": [["", "30–45 s"], ["", "30–45 s"], ["", "30–45 s"]], "rest": "60 s", "note": "Léger • trouver la charge"}]}, {"day": "Vendredi", "name": "Legs B + Bras + Cardio", "ex": [{"name": "Presse à 45°", "sets": [["125–130", "12"], ["125–130", "12"], ["125–130", "12"]], "rest": "2–3 min", "note": "Petite hausse vs S1"}, {"name": "Presse unilatérale", "sets": [["60", "11"], ["60", "11"], ["60", "11"]], "rest": "2 min", "note": "Charge par jambe"}, {"name": "Leg curl bilatéral", "sets": [["35", "12–13"], ["35", "12–13"], ["35", "12–13"], ["35", "12–13"]], "rest": "90 s", "note": "Uniquement sans douleur"}, {"name": "Leg extension", "sets": [["60", "14–15"], ["60", "14–15"], ["60", "14–15"]], "rest": "90 s", "note": "Sans douleur"}, {"name": "Abducteurs", "sets": [["50", "13–15"], ["50", "13–15"], ["50", "13–15"]], "rest": "60–90 s", "note": ""}, {"name": "Curl marteau corde", "sets": [["", "10–15"], ["", "10–15"], ["", "10–15"]], "rest": "90 s", "note": "Trouver la charge"}, {"name": "Curl machine / pupitre", "sets": [["", "10–15"], ["", "10–15"], ["", "10–15"]], "rest": "90 s", "note": "Trouver la charge"}, {"name": "Extension triceps haltère", "sets": [["15", "12"], ["15", "12"], ["15", "12"]], "rest": "90 s", "note": "Charge par bras"}, {"name": "Triceps poulie", "sets": [["27.5–30", "12–15"], ["27.5–30", "12–15"], ["27.5–30", "12–15"]], "rest": "60–90 s", "note": ""}, {"name": "Cardio", "sets": [["", "15–20 min"]], "rest": "", "note": "Intensité modérée"}]}];
const KEY='trainingS2_exact_v1';
const PROGRAM_KEY='training_custom_program_v1';
const WEEK_KEY='training_week_number_v1';
const APP_VERSION=5;
const importedProgram=JSON.parse(localStorage.getItem(PROGRAM_KEY)||'null');
if(Array.isArray(importedProgram)&&importedProgram.length) sessions=importedProgram;
let currentWeek=Number(localStorage.getItem(WEEK_KEY)||2);
let state=JSON.parse(localStorage.getItem(KEY)||'{"doneSessions":{},"sets":{},"history":[]}');
let current=null, timerInt=null;
const app=document.getElementById('app');
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function header(){return `<div class="top"><div><div class="eyebrow">PROGRAMME FORCE & MASSE</div><h1 class="title">Training</h1></div><button class="btn" onclick="resetAll()">Réinitialiser</button></div>`}
function week(){
 current=null; document.getElementById('weekBtn').classList.add('active');document.getElementById('histBtn').classList.remove('active');
 let n=Object.values(state.doneSessions).filter(Boolean).length;
 app.innerHTML=header()+`<div class="hero"><div class="accent">SEMAINE ${currentWeek}</div><div class="heroRow"><div><h2>Ta semaine d'entraînement</h2><div class="muted">${n} séance${n>1?'s':''} terminée${n>1?'s':''} sur 5</div></div><div class="pct">${n*20}%</div></div></div>`+
 sessions.map((s,i)=>`<div class="session" onclick="openWorkout(${i})"><h3>${s.day} — ${s.name}</h3><span class="muted">${s.ex.length} exercices ${state.doneSessions[i]?'• ✓ terminée':''}</span></div>`).join('')+
 `<div class="exercise"><h3>Gestion des semaines</h3><div class="target">Exporte tes résultats pour me les envoyer, ou importe une semaine que je t’ai préparée.</div><button class="btn" style="width:100%;margin:5px 0" onclick="exportResults()">Exporter mes résultats</button><button class="btn" style="width:100%;margin:5px 0" onclick="document.getElementById('importFile').click()">Importer une semaine</button><input id="importFile" class="hidden" type="file" accept=".json,application/json" onchange="importWeek(this.files[0])"></div>`;
}
function key(si,ei,ki){return `${si}-${ei}-${ki}`}
function openWorkout(si){
 current=si;let s=sessions[si];
 app.innerHTML=header()+`<button class="btn back" onclick="week()">‹ Semaine ${currentWeek}</button><div class="day">${s.day.toUpperCase()}</div><h2 class="workTitle">${s.name}</h2>`+
 s.ex.map((e,ei)=>`<div class="exercise"><h3>${e.name}</h3><div class="target">Objectif : ${e.sets.map(x=>`${x[0]||'—'} kg × ${x[1]}`).join(' • ')}${e.rest?' • Repos '+e.rest:''}${e.note?' • '+e.note:''}</div>`+
 e.sets.map((x,ki)=>{let k=key(si,ei,ki),v=state.sets[k]||{kg:x[0],reps:'',rir:'',done:false};return `<div class="setrow"><span>S${ki+1}</span><input inputmode="decimal" aria-label="kg" value="${esc(v.kg)}" placeholder="kg" onchange="upd('${k}','kg',this.value)"><input inputmode="decimal" aria-label="reps" value="${esc(v.reps)}" placeholder="${esc(x[1])}" onchange="upd('${k}','reps',this.value)"><input inputmode="decimal" aria-label="RIR" value="${esc(v.rir)}" placeholder="RIR" onchange="upd('${k}','rir',this.value)"><button class="check ${v.done?'on':''}" onclick="toggleSet('${k}',this.dataset.rest)" data-rest="${esc(e.rest)}">${v.done?'✓':'○'}</button></div>`}).join('')+`</div>`).join('')+
 `<button class="finish" onclick="finishWorkout(${si})">${state.doneSessions[si]?'✓ Séance terminée':'Terminer la séance'}</button>`;
 window.scrollTo(0,0)
}
function upd(k,f,v){state.sets[k]=state.sets[k]||{};state.sets[k][f]=v;save()}
function secondsFromRest(r){if(!r)return 0;if(r.includes('3–4'))return 210;if(r.includes('2–3'))return 150;if(r.includes('2 min'))return 120;if(r.includes('90'))return 90;if(r.includes('60'))return 60;return 90}
function toggleSet(k,rest){state.sets[k]=state.sets[k]||{};state.sets[k].done=!state.sets[k].done;save();if(state.sets[k].done)startTimer(secondsFromRest(rest));openWorkout(current)}
function startTimer(sec){if(!sec)return;clearInterval(timerInt);let left=sec,t=document.getElementById('timer');t.classList.add('show');function draw(){t.textContent=`Repos ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;if(left--<=0){clearInterval(timerInt);t.textContent='Repos terminé ✓';setTimeout(()=>t.classList.remove('show'),2500)}}draw();timerInt=setInterval(draw,1000)}
function finishWorkout(si){state.doneSessions[si]=true;state.history.unshift({date:new Date().toLocaleString('fr-FR'),name:sessions[si].day+' — '+sessions[si].name});save();week()}
function history(){document.getElementById('histBtn').classList.add('active');document.getElementById('weekBtn').classList.remove('active');app.innerHTML=header()+`<div class="day">HISTORIQUE</div><h2 class="workTitle">Tes séances</h2>`+(state.history.length?state.history.map(h=>`<div class="historyItem"><b>${h.name}</b><div class="muted small">${h.date}</div></div>`).join(''):`<div class="muted">Aucune séance terminée pour le moment.</div>`)}

function exportResults(){
 const payload={
   format:"training-results-v1",
   exportedAt:new Date().toISOString(),
   week:currentWeek,
   program:sessions,
   results:state
 };
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download=`Training_S${currentWeek}_resultats.json`;
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function validImportedProgram(x){
 return Array.isArray(x)&&x.length>0&&x.every(s=>s&&typeof s.day==="string"&&typeof s.name==="string"&&Array.isArray(s.ex));
}
function importWeek(file){
 if(!file)return;
 const r=new FileReader();
 r.onload=()=>{
   try{
     const obj=JSON.parse(r.result);
     const incoming=Array.isArray(obj)?obj:(obj.program||obj.sessions);
     if(!validImportedProgram(incoming)) throw new Error("format");
     sessions.splice(0,sessions.length,...incoming);
     currentWeek=Number(obj.week||obj.weekNumber||(currentWeek+1));
     localStorage.setItem(PROGRAM_KEY,JSON.stringify(incoming));
     localStorage.setItem(WEEK_KEY,String(currentWeek));
     state={doneSessions:{},sets:{},history:state.history||[]};
     save();
     alert(`Semaine ${currentWeek} importée ✓`);
     week();
   }catch(e){alert("Ce fichier n’est pas une semaine Training valide.");}
 };
 r.readAsText(file);
}
function resetAll(){if(confirm('Effacer toutes les saisies de cette semaine ?')){localStorage.removeItem(KEY);state={doneSessions:{},sets:{},history:[]};week()}}

async function checkForUpdate(){
 try{
   const url=new URL(window.location.href);
   url.searchParams.set("_check",Date.now());
   const r=await fetch(url.toString(),{cache:"no-store"});
   const txt=await r.text();
   const m=txt.match(/name=["']training-version["']\s+content=["'](\d+)["']/i);
   if(m && Number(m[1])>APP_VERSION) document.getElementById("updatebar").classList.add("show");
 }catch(e){}
}
function applyUpdate(){
 const u=new URL(window.location.href);
 u.searchParams.set("_v",Date.now());
 window.location.replace(u.toString());
}
window.addEventListener("focus",checkForUpdate);
setTimeout(checkForUpdate,800);
document.getElementById('weekBtn').onclick=week;document.getElementById('histBtn').onclick=history;week();
</script></body></html>
