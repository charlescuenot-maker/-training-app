<!doctype html><html lang='fr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#0b0d10'><title>Training — S2</title><link rel='manifest' href='manifest.json'><link rel='stylesheet' href='style.css'></head><body>
<header><div><small>PROGRAMME FORCE & MASSE</small><h1>Training</h1></div><button id='resetBtn' class='ghost'>Réinitialiser</button></header>
<main><section id='home' class='view active'><div class='weekcard'><div><span class='pill'>SEMAINE 2</span><h2>Ta semaine d'entraînement</h2><p id='progressText'>0 séance terminée sur 5</p></div><div class='ring' id='ring'>0%</div></div><div id='sessions' class='sessions'></div><div class='stats'><div><b id='setsDone'>0</b><span>séries validées</span></div><div><b id='totalReps'>0</b><span>reps saisies</span></div><div><b id='avgRir'>—</b><span>RIR moyen</span></div></div></section>
<section id='workout' class='view'><button id='backBtn' class='back'>‹ Semaine 2</button><div id='workoutHead'></div><div id='exerciseList'></div><button id='finishBtn' class='finish'>Terminer la séance ✓</button></section>
<section id='history' class='view'><h2>Historique</h2><p class='muted'>Tes performances de S2 sont sauvegardées sur cet appareil.</p><div id='historyContent'></div></section></main>
<nav><button data-view='home' class='nav active'>Semaine</button><button data-view='history' class='nav'>Historique</button></nav><script src='app.js'></script></body></html>
